name: CD

# Builds and publishes container images to GHCR, then (on main only)
# deploys them to the target server over SSH. See docs/22-ci-cd.md for the
# full pipeline description and the secrets this workflow needs.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to server after building images"
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # CI must be green on this exact commit before we build/deploy anything
  # from it — a red `main` never reaches the server.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow on this commit
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: '^(Backend|Frontend|Docker).*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  build-and-push:
    name: Build & push images
    needs: wait-for-ci
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.api_meta.outputs.tags }}
      web_image: ${{ steps.web_meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image namespace
        id: namespace
        run: echo "value=${REGISTRY,,}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata (api/worker share one image; only the
          command differs — see docker-compose.prod.yml)
        id: api_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.namespace.outputs.value }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image metadata
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.namespace.outputs.value }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    # Tag pushes (v1.2.3) publish images for a manual/controlled rollout;
    # only a merge to main auto-deploys. workflow_dispatch respects its
    # `deploy` input so images can be built without touching the server.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    environment:
      name: production
      url: https://radar.arvexo.ru
    steps:
      - name: Resolve image tags for this commit
        id: images
        run: |
          echo "api=${REGISTRY,,}/${GITHUB_REPOSITORY,,}-api:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY,,}/${GITHUB_REPOSITORY,,}-web:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: API_IMAGE,WEB_IMAGE,GHCR_TOKEN,GHCR_USER
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export API_IMAGE="${{ steps.images.outputs.api }}"
            export WEB_IMAGE="${{ steps.images.outputs.web }}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # Idempotent safety net: the api container already runs this on
            # start, but running it here surfaces a migration failure in the
            # deploy log instead of only in `docker compose logs api`.
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head
            docker image prune -f
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      - name: Smoke test /health and /ready
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            curl -fsS http://localhost:8000/api/v1/health
            curl -fsS http://localhost:8000/api/v1/ready
