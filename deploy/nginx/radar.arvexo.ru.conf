# nginx reverse proxy for radar.arvexo.ru -> Arvexo Radar containers.
#
# The app itself only listens on 127.0.0.1:${API_HOST_PORT}/${WEB_HOST_PORT}
# (see docker-compose.prod.yml) — this file is what actually exposes it to
# the internet, on ports 80/443 that nginx already owns on this host.
#
# Install:
#   sudo cp deploy/nginx/radar.arvexo.ru.conf /etc/nginx/sites-available/radar.arvexo.ru
#   sudo ln -s /etc/nginx/sites-available/radar.arvexo.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d radar.arvexo.ru   # issues TLS + rewrites this file for HTTPS
#
# Adjust the two `set $...` ports below if API_HOST_PORT/WEB_HOST_PORT in
# .env were changed from their docker-compose.prod.yml defaults (38000/38080).

server {
    listen 80;
    listen [::]:80;
    server_name radar.arvexo.ru;

    set $api_port 38000;
    set $web_port 38080;

    client_max_body_size 120m; # room above ARVEXO_MAX_UPLOAD_BYTES (100MB) for multipart overhead

    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:$api_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:$web_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev-style HMR isn't in play in `next start`, but keep
        # Upgrade headers for forward-compat with any websocket usage.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
