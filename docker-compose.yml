services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arvexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arvexo}
      POSTGRES_DB: ${POSTGRES_DB:-arvexo_radar}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arvexo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    volumes:
      - ./backend/app:/app/app
      - controlled_storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker.main
    env_file: .env
    volumes:
      - ./backend/app:/app/app
      - controlled_storage:/data/storage
      - model_cache:/data/model-cache
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    command: npm run dev
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  controlled_storage:
  model_cache:
